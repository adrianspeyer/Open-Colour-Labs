    <script>
    // =================================================================

    const rr = (a, b) => Math.random() * (b - a) + a;

    const SIM_DESCRIPTIONS = {
        protan: {
            sim: `<strong>For someone with normal colour vision:</strong> The left side shows vivid red peppers and apples that are clearly different from the green peppers and broccoli. On the right (protanopia simulation), those reds become <em>dark and muddy</em> — almost brown. If both sides look the same to you, this matches how you see the world.`,
            reveal: `<strong>This is for you.</strong> Toggle to "Colours Revealed" and look at the apples and red peppers on the left side of the image. If new, brighter tones appear where you normally see dark or brownish colours, those are the reds your eyes have been missing. The more dramatic the change, the stronger the effect. Someone without colour vision deficiency would see <em>no difference</em> between the two views.`
        },
        deutan: {
            sim: `<strong>For someone with normal colour vision:</strong> The left side shows red peppers that are completely different from the green peppers and broccoli. On the right (deuteranopia simulation), reds and greens blur into <em>similar brownish-yellow tones</em>. If both sides look the same to you, this matches how you see the world.`,
            reveal: `<strong>This is for you.</strong> Toggle to "Colours Revealed" and look at the red peppers versus the green peppers. If you suddenly see a <em>clear difference</em> between items that normally look similar to you, those are the colour distinctions your eyes miss. Someone without colour vision deficiency would see <em>no difference</em> between the two views.`
        },
        tritan: {
            sim: `<strong>For someone with normal colour vision:</strong> The left side shows bright yellow bananas and lemons clearly distinct from the green peppers and apples. On the right (tritanopia simulation), yellows and greens <em>blend together</em>, and the purple grapes lose their colour. If both sides look the same to you, this matches how you see the world.`,
            reveal: `<strong>This is for you.</strong> Toggle to "Colours Revealed" and look at the bananas versus the green peppers. If colours that normally look the same to you suddenly <em>separate into distinct tones</em>, those are the blue-yellow distinctions your eyes miss. Someone without colour vision deficiency would see <em>no difference</em> between the two views.`
        }
    };

    // Per-type detail for results
    const TYPE_DETAIL = {
        Protan: {
            prevalence: 'Protanomaly (mild) affects ~1% of males; protanopia (severe) affects ~1% of males. It is caused by a deficiency or absence of the L-cone (long wavelength / red receptor).',
            impact: 'Reds appear <strong>dark and muted</strong> — they can look brown, olive, or even black. Difficulty distinguishing red vs green traffic lights (you rely on position), ripe vs unripe fruit, and red warning indicators on dashboards or charts. Brown and green clothing may look identical.',
            luminance: 'Unlike deuteranopia, protanopia causes <strong>luminance loss</strong> on warm colours. The L-cone contributes ~60% of perceived brightness, so reds literally look darker to you — not just a different hue, but dimmer.',
            career: 'May affect eligibility for aviation, maritime, rail, electrical, emergency services, and military roles that require colour discrimination.',
            sources: '<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12385717/" target="_blank" rel="noopener noreferrer">Alhazmi 2025</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/41022199/" target="_blank" rel="noopener noreferrer">Gobira et al. 2025</a> · <a href="https://www.aaojournal.org/article/S0161-6420(25)00465-8/abstract" target="_blank" rel="noopener noreferrer">Global CVD Meta-Analysis 2025</a>'
        },
        Deutan: {
            prevalence: 'Deuteranomaly (mild) affects ~5% of males; deuteranopia (severe) affects ~1% of males. This is the <strong>most common</strong> colour vision deficiency worldwide, affecting roughly 1 in 12 men of Northern European descent. Caused by a deficiency or absence of the M-cone (medium wavelength / green receptor).',
            impact: 'Reds and greens blend into similar brownish-yellow tones. Difficulty with colour-coded charts and maps, choosing matching clothing, cooking (raw vs cooked meat can look similar), and distinguishing ripe vs unripe produce.',
            luminance: 'Unlike protanopia, deuteranopia does <strong>not</strong> cause significant luminance loss. Colours shift in hue but stay roughly the same brightness. This is why you can often pass brightness-based tests but fail hue-based ones.',
            career: 'Same occupational restrictions as protan — aviation, maritime, rail, electrical, emergency services, and military roles.',
            sources: '<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12385717/" target="_blank" rel="noopener noreferrer">Alhazmi 2025</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/41022199/" target="_blank" rel="noopener noreferrer">Gobira et al. 2025</a> · <a href="https://www.aaojournal.org/article/S0161-6420(25)00465-8/abstract" target="_blank" rel="noopener noreferrer">Global CVD Meta-Analysis 2025</a>'
        },
        Tritan: {
            prevalence: 'Tritanomaly and tritanopia are rare, affecting roughly 1 in 10,000 people. Unlike red-green CVD, tritan deficiency is <strong>not X-linked</strong> — it affects males and females equally. It can be congenital or acquired.',
            impact: 'Blues and yellows are confused. Difficulty distinguishing sky from water, yellow from pink, and blue from green. Purple may look reddish or brownish.',
            luminance: 'Tritan deficiency affects the S-cone (short wavelength / blue receptor). Because S-cones contribute minimally to luminance, brightness perception is largely unaffected.',
            career: 'Tritan deficiency can be <strong>acquired</strong> through age-related changes, medication, diabetes, or ocular disease. A professional evaluation is recommended to rule out underlying conditions.',
            sources: '<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12385717/" target="_blank" rel="noopener noreferrer">Alhazmi 2025</a> · <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11417771/" target="_blank" rel="noopener noreferrer">FM100 Lifespan Study 2024</a>'
        }

            this._raf = null; this._sliderClean = null;
            this.setView = this.setView.bind(this);
            this.answer = this.answer.bind(this);
            this.render();
        }

        setView(v) {
            this.S.view = v;
            if (v === 'test') { this.S.plateIdx = 0; this.S.history = []; }
            if (v === 'sim') { this.S.revealOn = false; this.S.revealFiltered = false; }
            this.render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ── PLATE DRAWING ──
        drawPlate(canvas, plate) {
            const ctx = canvas.getContext('2d');
            const W = canvas.width, H = canvas.height, cx = W/2, cy = H/2, R = W*0.45;
            ctx.clearRect(0,0,W,H);

            const makeMask = (num) => {
                const m = document.createElement('canvas'); m.width=W; m.height=H;
                const mc = m.getContext('2d'); mc.fillStyle='#000'; mc.fillRect(0,0,W,H);
                if (num && num !== 'X') {
                    mc.fillStyle='#fff'; mc.font=`bold ${W*0.5}px system-ui,sans-serif`;
                    mc.textAlign='center'; mc.textBaseline='middle'; mc.fillText(num,cx,cy);
                }
                return mc.getImageData(0,0,W,H).data;
            };

            let bgC, fgC, fgC2, mask1, mask2, isTransform = false;
            switch (plate.type) {
                case 'demo':
                    bgC=[[180,50,45],[190,60,40]]; fgC=[[20,80,60],[30,90,55]]; break;
                case 'red_green':
                    bgC=[[90,40,50],[120,30,50]]; fgC=[[0,50,60],[15,60,55]]; break;
                case 'red_green_hard':
                    bgC=[[130,15,50],[150,15,50]]; fgC=[[350,15,50],[10,15,50]]; break;
                case 'brightness':
                    bgC=[[120,10,25],[140,15,30]]; fgC=[[350,80,20],[0,90,25]]; break;
                case 'tritan':
                    bgC=[[220,45,48],[240,40,50],[200,35,52]]; fgC=[[55,50,52],[45,55,48],[65,45,50]]; break;
                case 'hidden':
                    bgC=[[200,35,52],[170,30,50],[90,25,50],[250,25,48]]; fgC=[[0,45,50],[350,40,48],[15,42,52]]; break;
                case 'nothing':
                    bgC=fgC=[[120,30,50],[0,50,60],[90,40,50],[15,60,55]]; break;
                case 'transform':
                    isTransform = true;
                    // BG: neutral warm grey-green
                    bgC=[[60,15,48],[80,12,50],[100,10,46]];
                    // Protan number: reds that look DARK to protans (they miss it) but deutans see
                    fgC=[[355,60,42],[5,55,40],[345,50,44]];
                    // Deutan number: greens that look brownish to deutans (they miss it) but protans see
                    fgC2=[[120,50,42],[130,45,40],[110,55,44]];
                    break;
            }

            if (isTransform) {
                // Draw two overlapping numbers with offset positions
                const m1 = document.createElement('canvas'); m1.width=W; m1.height=H;
                const mc1 = m1.getContext('2d'); mc1.fillStyle='#000'; mc1.fillRect(0,0,W,H);
                mc1.fillStyle='#fff'; mc1.font=`bold ${W*0.42}px system-ui,sans-serif`;
                mc1.textAlign='center'; mc1.textBaseline='middle';
                mc1.fillText(plate.numP, cx - W*0.12, cy);
                mask1 = mc1.getImageData(0,0,W,H).data;

                const m2 = document.createElement('canvas'); m2.width=W; m2.height=H;
                const mc2 = m2.getContext('2d'); mc2.fillStyle='#000'; mc2.fillRect(0,0,W,H);
                mc2.fillStyle='#fff'; mc2.font=`bold ${W*0.42}px system-ui,sans-serif`;
                mc2.textAlign='center'; mc2.textBaseline='middle';
                mc2.fillText(plate.numD, cx + W*0.12, cy);
                mask2 = mc2.getImageData(0,0,W,H).data;

                const DOTS = 2200;
                for (let i=0; i<DOTS; i++) {
                    let x,y,d,att=0;
                    do { x=Math.random()*W; y=Math.random()*H; d=Math.hypot(x-cx,y-cy); att++; } while(d>R&&att<25);
                    if (d>R) continue;
                    const idx=(Math.floor(y)*W+Math.floor(x))*4;
                    const isP = mask1[idx]>128, isD = mask2[idx]>128;
                    const pal = isP ? fgC : (isD ? fgC2 : bgC);
                    const b = pal[Math.floor(Math.random()*pal.length)];
                    const r2 = rr(W*0.006, W*0.016);
                    ctx.beginPath(); ctx.arc(x,y,r2,0,Math.PI*2);
                    ctx.fillStyle=`hsl(${b[0]+rr(-8,8)},${b[1]+rr(-15,15)}%,${b[2]+rr(-8,8)}%)`;
                    ctx.fill();
                }
            } else {
                const maskData = makeMask(plate.num);
                const DOTS = 2000;
                for (let i=0; i<DOTS; i++) {
                    let x,y,d,att=0;
                    do { x=Math.random()*W; y=Math.random()*H; d=Math.hypot(x-cx,y-cy); att++; } while(d>R&&att<25);
                    if (d>R) continue;
                    const idx=(Math.floor(y)*W+Math.floor(x))*4;
                    const isNum = maskData[idx]>128;
                    const pal = isNum ? fgC : bgC;
                    const b = pal[Math.floor(Math.random()*pal.length)];
                    const r2 = rr(W*0.006, W*0.016);
                    ctx.beginPath(); ctx.arc(x,y,r2,0,Math.PI*2);
                    ctx.fillStyle=`hsl(${b[0]+rr(-8,8)},${b[1]+rr(-15,15)}%,${b[2]+rr(-8,8)}%)`;
                    ctx.fill();
                }
            }
        }

        answer(sel) {
            const p = this.S.seq[this.S.plateIdx];
            // Parse combo answers like "2 & 5" into individual numbers
            const parts = sel.includes('&') ? sel.split('&').map(s=>s.trim()) : [sel];
            const sawP = p.type==='transform' && parts.includes(p.numP);
            const sawD = p.type==='transform' && parts.includes(p.numD);
            this.S.history.push({ ...p, answer: sel,
                isCorrect: p.type === 'nothing' ? (sel === 'Nothing' || sel === 'Unsure')
                          : p.type === 'transform' ? (sawP || sawD)
                          : sel === p.num,
                sawProtan: sawP && !sawD,
                sawDeutan: sawD && !sawP,
                sawBoth:   sawP && sawD,
                isUnsure: sel === 'Unsure', isNothing: sel === 'Nothing'
            });
            if (this.S.plateIdx < this.S.seq.length - 1) { this.S.plateIdx++; this.render(); }
            else this.setView('results');
        }

        // ── DIAGNOSIS ──
        getDx() {
            const H = this.S.history;
            if (H.filter(h=>h.type==='demo'&&!h.isCorrect).length > 0) return {
                title:"Screen Calibration Issue", badge:"Invalid", cls:"sui-badge sui-badge-neutral", color:"var(--sui-neutral)",
                desc:"You missed control plates. Please increase brightness, disable Night Mode or colour filters, and retry.", severity:null, type:null };

            if (H.filter(h=>h.type==='nothing'&&!h.isNothing&&!h.isUnsure).length >= 2) return {
                title:"Unreliable Result", badge:"Invalid", cls:"sui-badge sui-badge-neutral", color:"var(--sui-neutral)",
                desc:"You identified numbers on purely random noise plates, which indicates guessing. Please retake carefully.", severity:null, type:null };

            const diag = H.filter(h=>!['nothing','demo','hidden','transform'].includes(h.type));
            const misses = diag.filter(h=>!h.isCorrect);
            const rgM = H.filter(h=>(h.type==='red_green'||h.type==='red_green_hard')&&!h.isCorrect);
            const brM = H.filter(h=>h.type==='brightness'&&!h.isCorrect);
            const trM = H.filter(h=>h.type==='tritan'&&!h.isCorrect);
            const hidH = H.filter(h=>h.type==='hidden'&&h.isCorrect);
            const tPro = H.filter(h=>h.type==='transform'&&h.sawProtan&&!h.sawBoth).length;
            const tDeu = H.filter(h=>h.type==='transform'&&h.sawDeutan&&!h.sawBoth).length;

            const unsC = misses.filter(h=>h.isUnsure).length;
            const noC = misses.filter(h=>h.isNothing).length;
            const sev = unsC > 0 && noC === 0 ? 'mild' : noC > 0 ? 'severe' : null;
            const sevLabel = sev === 'mild' ? 'Anomalous Trichromacy' : sev === 'severe' ? 'Likely Dichromacy' : '';
            const sevNote = sev === 'mild' ? ' Partial visibility on missed plates suggests anomalous trichromacy (mild to moderate).'
                          : sev === 'severe' ? ' Seeing nothing on missed plates suggests dichromacy (more severe).' : '';
            const hidNote = hidH.length > 0 ? ' You detected hidden-digit plates invisible to normal vision, providing additional confirmation.' : '';

            if (misses.length === 0 && hidH.length === 0) return {
                title:"Normal Colour Vision", badge:"Normal", cls:"sui-badge sui-badge-success", color:"var(--sui-success)",
                desc:"You identified all diagnostic plates correctly and didn't detect hidden-digit patterns. Your colour vision aligns with standard trichromacy.", severity:null, type:null };

            // Tritan
            if (trM.length >= 1 && brM.length === 0 && rgM.length === 0) return {
                title:"Likely Tritan (Blue-Yellow)", badge:"Tritan", cls:"sui-badge sui-badge-info", color:"var(--sui-info)",
                desc:"You struggled with blue-yellow plates but passed red-green." + sevNote + hidNote, severity:sev, type:'Tritan' };

            // Protan vs Deutan — use transformation plate data + brightness
            const protanScore = brM.length * 2 + tPro;
            const deutanScore = (rgM.length > 0 && brM.length === 0 ? 2 : 0) + tDeu;

            if (protanScore > deutanScore || brM.length >= 1) return {
                title:"Likely Protan (Red-Weak)", badge:"Protan", cls:"sui-badge sui-badge-error", color:"var(--sui-error)",
                desc:"You struggled with plates where red brightness was the key factor, and transformation plate responses align with protanomaly." + sevNote + hidNote, severity:sev, type:'Protan' };

            if (rgM.length >= 1) return {
                title:"Likely Deutan (Green-Weak)", badge:"Deutan", cls:"sui-badge sui-badge-warning", color:"var(--sui-warning)",
                desc:"You struggled with red-green hue differentiation but passed brightness plates, and transformation plate responses align with deuteranomaly." + sevNote + hidNote, severity:sev, type:'Deutan' };

            if (hidH.length > 0 && misses.length === 0) return {
                title:"Possible Mild Deficiency", badge:"Mild", cls:"sui-badge sui-badge-warning", color:"var(--sui-warning)",
                desc:"You passed all standard plates but detected hidden-digit patterns. This may indicate very mild anomalous trichromacy. An anomaloscope test can confirm.", severity:'mild', type:null };

            return { title:"Indeterminate", badge:"Check-up", cls:"sui-badge sui-badge-neutral", color:"var(--sui-text-primary)",
                desc:"The pattern is unclear. A professional optometrist can provide a definitive diagnosis." + sevNote + hidNote, severity:null, type:null };
        }

        // ── SLIDER ──
        initSlider() {
            if (this._sliderClean) this._sliderClean();
            const box = document.getElementById('cmp-box');
            if (!box) return;
            const top = box.querySelector('.cmp-top');
            const div = box.querySelector('.cmp-divider');
            let drag = false;

            const setPos = (cx) => {
                const r = box.getBoundingClientRect();
                let p = ((cx - r.left) / r.width) * 100;
                p = Math.max(2, Math.min(98, p));
                this.S.sliderPos = p;
                if (!this._raf) {
                    this._raf = requestAnimationFrame(() => {
                        top.style.clipPath = `inset(0 ${100-this.S.sliderPos}% 0 0)`;
                        div.style.left = this.S.sliderPos + '%';
                        this._raf = null;
                    });
                }
            };
            const dn = e => { drag=true; setPos(e.touches?e.touches[0].clientX:e.clientX); };
            const mv = e => { if(!drag)return; e.preventDefault(); setPos(e.touches?e.touches[0].clientX:e.clientX); };
            const up = () => { drag=false; };

            box.addEventListener('mousedown',dn);
            box.addEventListener('touchstart',dn,{passive:true});
            window.addEventListener('mousemove',mv);
            window.addEventListener('touchmove',mv,{passive:false});
            window.addEventListener('mouseup',up);
            window.addEventListener('touchend',up);

            top.style.clipPath = `inset(0 ${100-this.S.sliderPos}% 0 0)`;
            div.style.left = this.S.sliderPos + '%';

            this._sliderClean = () => {
                box.removeEventListener('mousedown',dn);
                box.removeEventListener('touchstart',dn);
                window.removeEventListener('mousemove',mv);
                window.removeEventListener('touchmove',mv);
                window.removeEventListener('mouseup',up);
                window.removeEventListener('touchend',up);
            };
        }

        // ── VIEWS ──
        vIntro() {
            return `<div class="fade-in" style="max-width:600px;text-align:center;">

                </p>
            </div>`;
        }

        vTest() {
            const p = this.S.seq[this.S.plateIdx], total = this.S.seq.length;
            const pct = Math.round((this.S.plateIdx / total) * 100);
            const isT = p.type === 'transform';
            const isMD = isT ? false : (p.num.length > 1 && p.num !== 'X');
            const min = isMD ? 10 : 2, max = isMD ? 99 : 9;

            let opts;
            if (isT) {
                // 4 buttons: numP, numD, real combo, decoy combo
                // Generate two unique decoy digits for the fake combo
                let d1, d2;
                do { d1 = String(Math.floor(Math.random()*8)+2); } while(d1===p.numP||d1===p.numD);
                do { d2 = String(Math.floor(Math.random()*8)+2); } while(d2===p.numP||d2===p.numD||d2===d1);
                const [dLo,dHi] = [d1,d2].sort((a,b)=>+a - +b);
                const [rLo,rHi] = [p.numP,p.numD].sort((a,b)=>+a - +b);
                opts = [p.numP, p.numD, `${rLo} & ${rHi}`, `${dLo} & ${dHi}`];
                // Shuffle so position isn't predictable
                for (let i=opts.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]; }
            } else {
                opts = new Set();
                if (p.num !== 'X') opts.add(p.num);
                while (opts.size < 4) opts.add(String(Math.floor(Math.random()*(max-min+1))+min));
                opts = [...opts].sort((a,b)=>+a - +b);
            }

            setTimeout(() => { const c=document.getElementById('tc'); if(c) this.drawPlate(c,p); }, 0);

            return `<div class="fade-in" style="display:flex;flex-direction:column;width:100%;max-width:460px;align-items:center;">

                    <i data-lucide="layers" style="width:12px;height:12px;" aria-hidden="true"></i>
                    Plate ${this.S.plateIdx+1} / ${total}
                </span>
                <div class="sui-progress sui-progress-success" role="progressbar"
                     aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"
                     style="margin-bottom:var(--sui-space-3);height:4px;">
                    <div class="sui-progress-bar" style="width:${pct}%;"></div>
                </div>
                <div class="plate-wrap" role="img" aria-label="Colour plate ${this.S.plateIdx+1}">
                    <canvas id="tc" width="800" height="800"></canvas>
                </div>
                <h2 style="font-size:var(--sui-text-h3);font-weight:var(--sui-weight-semibold);margin-bottom:var(--sui-space-2);">What number do you see?</h2>
                <div class="opt-grid" role="group" aria-label="Answer options">
                    ${opts.map(o=>`<button onclick="app.answer('${o}')" class="btn-opt">${o}</button>`).join('')}
                    <button onclick="app.answer('Nothing')" class="btn-special">
                        <i data-lucide="eye-off" style="width:14px;height:14px;vertical-align:middle;" aria-hidden="true"></i>
                        I see no number — just dots
                    </button>
                    <button onclick="app.answer('Unsure')" class="btn-special">
                        <i data-lucide="help-circle" style="width:14px;height:14px;vertical-align:middle;" aria-hidden="true"></i>
                        I see something, but can't make it out
                    </button>
                </div>
            </div>`;
        }

        vResults() {

                ${detail ? `

                        <h4>Prevalence</h4><p>${detail.prevalence}</p>
                        <h4>Daily Impact</h4><p>${detail.impact}</p>

                <button onclick="app.setView('test')" class="sui-btn sui-btn-ghost sui-btn-sm">

        vSim() {
            const t = this.S.simType;
            const tabs = ['protan','deutan','tritan'];
            const labels = { protan:'Protanopia', deutan:'Deuteranopia', tritan:'Tritanopia' };
            const reveal = this.S.revealOn;
            const filtered = this.S.revealFiltered;
            const desc = SIM_DESCRIPTIONS[t];
            const filterSim = `url(#f-${t})`;

            setTimeout(() => { if(!reveal) this.initSlider(); }, 0);

            return `<div class="fade-in" style="width:100%;max-width:900px;">
                <h2 style="font-size:var(--sui-text-h2);font-weight:var(--sui-weight-bold);margin-bottom:var(--sui-space-3);text-align:center;">The "Qualia" Validator</h2>
                <div class="sim-tabs" role="tablist" aria-label="Simulation type">
                    ${tabs.map(tb=>`
                        <button class="sim-tab ${t===tb&&!reveal?'active':''}" role="tab" aria-selected="${t===tb&&!reveal}"

                    `).join('')}
                    <button class="sim-tab ${reveal?'active':''}" role="tab" aria-selected="${reveal}"
                        onclick="app.S.revealOn=true;app.S.revealFiltered=false;app.render();">
                        &#10024; Reveal
                    </button>
                </div>
                <div class="sui-card" style="padding:var(--sui-space-3);margin-bottom:var(--sui-space-3);">
                    <p style="font-size:var(--sui-text-small);line-height:var(--sui-leading-body);color:var(--sui-text-secondary);">
                        ${reveal ? desc.reveal : desc.sim}
                    </p>
                </div>
                ${reveal ? `
                    <div style="position:relative;overflow:hidden;border:1px solid var(--sui-border);border-radius:var(--sui-radius-lg);">
                        <img class="reveal-img" id="reveal-base" src="test-image.jpg" alt="Your natural vision"
                             style="filter:none;position:relative;z-index:1;transition:opacity 0.4s var(--sui-easing);opacity:${filtered ? '0' : '1'};border:none;border-radius:0;">
                        <img class="reveal-img" src="test-image.jpg" alt="Colour-enhanced view"
                             style="filter:${filterReveal};position:absolute;top:0;left:0;z-index:0;border:none;border-radius:0;">
                        <span class="cmp-label cmp-label-l" id="reveal-label">${filtered ? 'COLOURS REVEALED' : 'YOUR VISION'}</span>
                    </div>
                    <div style="display:flex;justify-content:center;gap:var(--sui-space-2);margin-top:var(--sui-space-3);flex-wrap:wrap;">
                        <button id="btn-your-vision" onclick="app.toggleReveal(false)"
                                class="sui-btn ${!filtered?'sui-btn-primary':'sui-btn-ghost'} sui-btn-sm">
                            <i data-lucide="eye" style="width:16px;height:16px;" aria-hidden="true"></i> Your Vision
                        </button>
                        <button id="btn-colours-revealed" onclick="app.toggleReveal(true)"
                                class="sui-btn ${filtered?'sui-btn-success':'sui-btn-ghost'} sui-btn-sm">
                            <i data-lucide="sparkles" style="width:16px;height:16px;" aria-hidden="true"></i> Colours Revealed
                        </button>
                    </div>
                    <p style="text-align:center;font-size:var(--sui-text-meta);color:var(--sui-text-muted);margin-top:var(--sui-space-2);">
                        Showing: <strong>${labels[t]}</strong> reveal filter — switch type using the tabs above
                    </p>
                ` : `
                    <div id="cmp-box" class="compare-box" role="img" aria-label="Original vs ${labels[t]}">
                        <img class="cmp-bottom" src="test-image.jpg" alt="" style="filter:${filterSim};">
                        <img class="cmp-top" src="test-image.jpg" alt=""
                             style="clip-path:inset(0 ${100-this.S.sliderPos}% 0 0);">
                        <span class="cmp-label cmp-label-l">ORIGINAL</span>
                        <span class="cmp-label cmp-label-r">${labels[t].toUpperCase()}</span>
                        <div class="cmp-divider" style="left:${this.S.sliderPos}%;">
                            <div class="cmp-handle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M8 6l-4 6 4 6"/><path d="M16 6l4 6-4 6"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                `}
            </div>`;
        }

        // ── REVEAL TOGGLE (in-place crossfade, no re-render) ──
        toggleReveal(filtered) {
            this.S.revealFiltered = filtered;
            const base = document.getElementById('reveal-base');
            const label = document.getElementById('reveal-label');
            const btnYour = document.getElementById('btn-your-vision');
            const btnReveal = document.getElementById('btn-colours-revealed');
            if (!base || !label) return;
            base.style.opacity = filtered ? '0' : '1';
            label.textContent = filtered ? 'COLOURS REVEALED' : 'YOUR VISION';
            if (btnYour && btnReveal) {
                btnYour.className = `sui-btn ${!filtered?'sui-btn-primary':'sui-btn-ghost'} sui-btn-sm`;
                btnReveal.className = `sui-btn ${filtered?'sui-btn-success':'sui-btn-ghost'} sui-btn-sm`;
            }
        }

        render() {
            const views = { intro:'vIntro', test:'vTest', results:'vResults', sim:'vSim' };
            this.root.innerHTML = this[views[this.S.view]]();
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }
    }

    const app = new App();
    </script>
    <script src="https://cdn.jsdelivr.net/gh/adrianspeyer/speyer-ui@2.1.2/dist/sui.min.js" defer></script>
</body>
</html>
